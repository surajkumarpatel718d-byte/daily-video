name: daily-video

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  make-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NICHE: ${{ vars.NICHE }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      UPLIKA_TOKEN: ${{ secrets.UPLIKA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm install -g @anthropic-ai/claude-code
          git clone https://github.com/calesthio/OpenMontage.git
          cd OpenMontage && make setup
          mkdir -p ../out

      - name: Make the short and the long video
        working-directory: OpenMontage
        run: |
          COMMON="Work fully unattended: approve every checkpoint and gate yourself, do not wait for me. Use only free tools (Piper narration, free stock footage and open archives) unless a provider key is present in the environment. Stay under the budget cap and run the post-render self-review. Pick today's topic yourself in this niche: ${NICHE}. Never repeat a topic listed in ../topics_done.txt and append today's topic to it. Copy the final render to"
          claude -p "Make a ~45-second vertical 9:16 video. $COMMON ../out/short.mp4. Also write ../out/short.txt with a title under 100 characters on line 1 and a description after it." \
            --allowedTools "Bash,Read,Write,Edit" || echo "short failed"
          claude -p "Make a ~5-minute landscape 16:9 video. $COMMON ../out/long.mp4. Also write ../out/long.txt with a title under 100 characters on line 1 and a description after it." \
            --allowedTools "Bash,Read,Write,Edit" || echo "long failed"

      - name: Save to a GitHub Release (public URLs)
        run: |
          ls -la out
          TAG="videos-$(date +%F)"
          gh release create "$TAG" out/* --title "$TAG" --notes "Daily videos" || gh release upload "$TAG" out/* --clobber

      - name: Post privately to YouTube via uplika (only if UPLIKA_TOKEN is set)
        if: env.UPLIKA_TOKEN != ''
        run: |
          TAG="videos-$(date +%F)"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          claude mcp add --transport http uplika https://api.uplika.com/mcp --header "Authorization: Bearer $UPLIKA_TOKEN"
          claude -p "Using uplika: for each of short and long, take the file URL $BASE/short.mp4 and $BASE/long.mp4 (media_from_url, aiGenerated true), read the title and description from out/short.txt and out/long.txt, and publish each to my YouTube channel with privacyStatus private. Reply with the post ids." \
            --allowedTools "Bash,Read,mcp__uplika"
